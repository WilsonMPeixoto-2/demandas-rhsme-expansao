name: "CTRH • Importar arte aprovada do login (uma execução)"
on:
  push:
    branches:
      - feat/login-arte-monumental-aprovada
    paths:
      - .github/workflows/import-login-approved-art-20261031.yml
permissions:
  contents: write
jobs:
  import-approved-art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do commit autorizado
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Obter e validar arte 4K original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/design
          curl --fail --location --show-error --silent --retry 3 --max-time 90 \
            'https://media.base44.com/images/public/6ae5abe30f59a8ee7dc28e9c/0685b939e_portal_fluxo_ctrh_arte_original_4K_3840.webp' \
            --output public/design/portal_fluxo_ctrh_arte_original_4K_3840.webp
          echo '6976c4b88afb9008c224d16046c6e1b2fe856284d97bc0563265d099cb15c9d6  public/design/portal_fluxo_ctrh_arte_original_4K_3840.webp' | sha256sum --check
          test "$(stat -c %s public/design/portal_fluxo_ctrh_arte_original_4K_3840.webp)" -eq 965396
          file public/design/portal_fluxo_ctrh_arte_original_4K_3840.webp
      - name: Versionar imagem na branch, nunca na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/design/portal_fluxo_ctrh_arte_original_4K_3840.webp
          git commit -m 'assets(login): preservar composição monumental original 4K'
          git push origin HEAD:feat/login-arte-monumental-aprovada
