name: Install Storybook in isolated workbench branch
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/install-storybook-workbench.yml'
      - 'docs/design/STORYBOOK_WORKBENCH_SETUP_2026-10-29.md'
      - '.storybook/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: write
jobs:
  install:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/storybook-visual-workbench-20261029' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install current lockfile
        run: npm ci
      - name: Generate Storybook 10.6 React-Vite workbench (docs + accessibility)
        run: npm create storybook@10.6 -- --type react --yes --features docs a11y --package-manager npm --disable-telemetry --no-dev
      - name: Verify version, build and existing project compatibility
        run: |
          npm ci
          npm run build-storybook
          npm run lint
          npm run build
          npm run test:coverage
      - name: Check scope and save isolated workbench configuration
        run: |
          git status --short
          test -f .storybook/main.ts
          node -e "let p=require('./package.json'); if (!p.scripts['build-storybook']) process.exit(1)"
          git add package.json package-lock.json .storybook src/stories .gitignore
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(design): install Storybook 10.6 visual component workbench'
          git push origin HEAD:${{ github.head_ref }}
