name: Install UI UX Pro Max (isolated project skill)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/install-uiux-pro-max.yml'
      - 'docs/design/UIUX_PRO_MAX_INSTALL_2026-10-29.md'
      - '.agents/skills/ui-ux-pro-max/**'
permissions:
  contents: write
jobs:
  install:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/install-uiux-pro-max-20261029' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install a fixed version of official CLI (without dependency lifecycle scripts)
        run: npm install -g ui-ux-pro-max-cli@2.15.0 --ignore-scripts --no-audit --no-fund
      - name: Generate universal local skill with bundled offline assets
        env:
          CI: 'true'
          # Never pass the GitHub Actions GITHUB_TOKEN to the third-party installer.
          GITHUB_TOKEN: ''
        run: |
          uipro init --ai universal --offline
          test -f .agents/skills/ui-ux-pro-max/SKILL.md
          test -d .agents/skills/ui-ux-pro-max
          du -sh .agents/skills/ui-ux-pro-max
      - name: Review changes and save only generated skill
        run: |
          git status --short
          git add .agents/skills/ui-ux-pro-max
          if git diff --cached --quiet; then
            echo 'UI/UX Pro Max skill is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(design): install pinned UI UX Pro Max skill assets'
          git push origin HEAD:${{ github.head_ref }}
