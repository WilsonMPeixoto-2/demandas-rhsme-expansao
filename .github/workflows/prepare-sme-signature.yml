name: Preparar assinatura oficial SME
on:
  push:
    branches: ['fix/wide-screen-institutional-signature']
    paths: ['.github/workflows/prepare-sme-signature.yml']
permissions:
  contents: read
jobs:
  official-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obter arquivo original publicado pela SME
        env:
          SIGNATURE_URL: https://educacao.prefeitura.rio/wp-content/uploads/sites/42/2025/01/RIOPREFEITURA-Educacao-horizontal-monocromatica-branco-1.png
        run: |
          curl --fail --location --retry 2 --max-time 45 "$SIGNATURE_URL" --output /tmp/ctrh-sme-signature.png
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, struct
          data = pathlib.Path('/tmp/ctrh-sme-signature.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'A fonte precisa ser PNG'
          width, height = struct.unpack('>II', data[16:24])
          print('CTRH_SIGNATURE_META=' + json.dumps({'width': width, 'height': height, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}))
          print('CTRH_SIGNATURE_BASE64_BEGIN')
          print(base64.encodebytes(data).decode())
          print('CTRH_SIGNATURE_BASE64_END')
          PY
