name: Supabase local migration gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/seed.sql'
      - 'scripts/ci/stage-supabase-migrations.mjs'
      - 'scripts/ci/stage-supabase-migrations.test.ts'
      - '.github/workflows/supabase-local-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-migrations:
    name: Replay and validate migrations in ephemeral Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CYCLE3_BOUNDARY: 20260722101325_20260722090000_central_trabalho_expand.sql
      MIGRATION_STAGE_DIR: /tmp/cthr-staged-supabase-migrations
      MIGRATION_MANIFEST: /tmp/cthr-staged-supabase-migrations.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Stage every migration from Cycle 3 onward
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cthr-staged-supabase-migrations
          rm -f /tmp/cthr-staged-supabase-migrations.json
          node scripts/ci/stage-supabase-migrations.mjs stage \
            --migrations-dir supabase/migrations \
            --staging-dir "$MIGRATION_STAGE_DIR" \
            --manifest "$MIGRATION_MANIFEST" \
            --boundary "$CYCLE3_BOUNDARY"
          supabase db start

      - name: Insert synthetic Cycle 3 legacy fixture
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle3_legacy_fixture.sql

      - name: Apply and validate Cycle 3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/stage-supabase-migrations.mjs restore \
            --migrations-dir supabase/migrations \
            --staging-dir "$MIGRATION_STAGE_DIR" \
            --manifest "$MIGRATION_MANIFEST" \
            --stage cycle3
          supabase migration up --local
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle3_invariants.sql

      - name: Insert synthetic users for later mutation invariants
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle4_mutations_fixture.sql

      - name: Apply the complete post-Cycle-3 chain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/stage-supabase-migrations.mjs restore \
            --migrations-dir supabase/migrations \
            --staging-dir "$MIGRATION_STAGE_DIR" \
            --manifest "$MIGRATION_MANIFEST" \
            --stage postCycle3
          supabase migration up --local 2>&1 | tee post-cycle3-migration-report.txt

      - name: Verify manifest restoration and clean migration tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find /tmp/cthr-staged-supabase-migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"
          git diff --exit-code -- supabase/migrations

      - name: Validate Cycle 4 roles, transactions and logical deletion
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle4_mutations_invariants.sql 2>&1 | tee cycle4-invariants-report.txt
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cycle4_physical_delete_invariants.sql 2>&1 | tee cycle4-physical-delete-report.txt

      - name: Prepare and capture synthetic null-authorship baseline
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/e4_legacy_null_authorship_fixture.sql
          mkdir -p /tmp/cthr-e4-baseline
          psql "$LOCAL_DB_URL" -Atc "select count(*) from public.sme_demandas where updated_by is null;" > /tmp/cthr-e4-baseline/demandas_updated_by_null.txt
          psql "$LOCAL_DB_URL" -Atc "select count(*) from public.sme_historico where created_by is null;" > /tmp/cthr-e4-baseline/historico_created_by_null.txt

      - name: Validate E4 visibility, actor and null-authorship invariants
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_deleted_visibility_invariants.sql 2>&1 | tee e4-invariants-report.txt
          test "$(cat /tmp/cthr-e4-baseline/demandas_updated_by_null.txt)" = "$(psql "$LOCAL_DB_URL" -Atc "select count(*) from public.sme_demandas where updated_by is null;")"
          test "$(cat /tmp/cthr-e4-baseline/historico_created_by_null.txt)" = "$(psql "$LOCAL_DB_URL" -Atc "select count(*) from public.sme_historico where created_by is null;")"

      - name: Validate retired and current RPC grants
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/r1_retired_rpc_invariants.sql 2>&1 | tee r1-retired-rpc-report.txt

      - name: Verify pg_net is absent after E1A replay
        run: |
          test "$(psql "$LOCAL_DB_URL" -Atc "select count(*) from pg_extension where extname = 'pg_net';")" = "0"

      - name: Upload database reports, manifest and validated migrations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supabase-database-reports
          path: |
            /tmp/cthr-staged-supabase-migrations.json
            post-cycle3-migration-report.txt
            cycle4-invariants-report.txt
            cycle4-physical-delete-report.txt
            e4-invariants-report.txt
            r1-retired-rpc-report.txt
            supabase/migrations/*.sql
          if-no-files-found: warn
          retention-days: 14

      - name: Replay the complete migration chain from scratch
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/r1_retired_rpc_invariants.sql

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup || true
