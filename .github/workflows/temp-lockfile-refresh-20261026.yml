name: Temporary lockfile refresh 2026-10-26

on:
  push:
    branches:
      - chore/dependencies-database-audit-20261026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/dependencies-database-audit-20261026
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Regenerate npm lockfile
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: regenerar lockfile no Node 24 [lockfile-refreshed]"
          git push origin HEAD:chore/dependencies-database-audit-20261026
