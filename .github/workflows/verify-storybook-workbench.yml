name: Verify Storybook visual workbench
on:
  pull_request:
    paths:
      - '.storybook/**'
      - 'src/stories/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/verify-storybook-workbench.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
